# INFEED multi-axis stepper controller — STM32F407 Discovery / Shelly "Main".
# 3 step/dir banks (4 drives, bank 3 = synchronous pair) + polled sensors,
# drive feedback (ALM/PEND) and SMEMA handshake (reserved).

CONFIG_STEPPER=y
CONFIG_GPIO=y
CONFIG_COUNTER=y            # per-axis step timing via st,stm32-counter (TIM2/3/5)
# Deliver STEPS_COMPLETED from ISR so motion_go() gets its completion signal
# (our callback only gives a semaphore = ISR-safe). Without this the events are
# dropped and every fixed-distance move hits its timeout.
CONFIG_STEPPER_GPIO_STEPPER_GENERATE_ISR_SAFE_EVENTS=y
CONFIG_WATCHDOG=y           # IWDG — firmware-hang safety layer

# Interactive bring-up over the USART3 console
CONFIG_SHELL=y
CONFIG_STEPPER_SHELL=y

CONFIG_LOG=y
CONFIG_STEPPER_LOG_LEVEL_INF=y

# Fixed static malloc arena. The default -1 ("all remaining RAM") runs the heap
# to the top of the 128K SRAM (0x20020000); its end-marker write hits the
# unmapped boundary (DTCM is at 0x10000000, not contiguous) -> silent boot bus
# fault. (Diagnosed on the L476 emulator — same non-contiguous SRAM trap.)
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192

# Console/shell over USB-CDC-ACM on the OTG-FS port (no VCP on the F4-Disco).
# USB_DEVICE_INITIALIZE_AT_BOOT auto-enables the stack so the CDC ACM is the
# console/shell backend without a usb_enable() call in app code.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_PRODUCT="INFEED F407 controller"

# Persistent sensor-role map + polarity + direction. STM32F4 flash above 128K is
# all 128K erase sectors; the NVS *settings* backend hard-caps sector size at 64K
# (UINT16), so NVS can't back settings here. ZMS handles large sectors (32-bit
# sizing) -> use it. Storage = storage_partition (top 3 sectors) in the overlay.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
