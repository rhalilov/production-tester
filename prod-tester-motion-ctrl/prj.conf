# C++ support
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# Shell (CLI)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_PROMPT_CHANGE=y
CONFIG_SHELL_PROMPT_BUFF_SIZE=40
CONFIG_SHELL_VT100_COLORS=y

# USB CDC-ACM (operator console)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_PRODUCT="PTMC Motion Controller"
CONFIG_UART_LINE_CTRL=y

# UART (tester communication)
CONFIG_SERIAL=y

# Settings persistence (ZMS)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y

# Malloc arena (avoid bus fault on non-contiguous SRAM)
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192

# Watchdog
CONFIG_WATCHDOG=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y

# GPIO
CONFIG_GPIO=y

# Stepper driver
CONFIG_STEPPER=y

# Counter (step timing)
CONFIG_COUNTER=y

# Machine selection
CONFIG_MACHINE_INFEED_TESTER=y

# Float printf support (for mm display)
CONFIG_CBPRINTF_FP_SUPPORT=y
