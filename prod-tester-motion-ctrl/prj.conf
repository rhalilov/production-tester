# C++ support
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# Shell (CLI)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_CMD_BUFF_SIZE=128

# USB CDC-ACM (operator console)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y

# UART (tester communication)
CONFIG_SERIAL=y

# Settings persistence (ZMS/NVS)
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Watchdog
CONFIG_WATCHDOG=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y

# GPIO
CONFIG_GPIO=y

# Stepper driver
CONFIG_STEPPER=y
CONFIG_STEP_DIR_STEPPER=y

# Counter (step timing)
CONFIG_COUNTER=y

# Machine selection
CONFIG_MACHINE_INFEED_TESTER=y
